services:
  escalat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escalat
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-}
      N8N_BUSY_WEBHOOK_URL: ${N8N_BUSY_WEBHOOK_URL:-}
      N8N_BOOK_WEBHOOK_URL: ${N8N_BOOK_WEBHOOK_URL:-}
      N8N_CHAT_BASIC_USER: ${N8N_CHAT_BASIC_USER:-}
      N8N_CHAT_BASIC_PASSWORD: ${N8N_CHAT_BASIC_PASSWORD:-}
      N8N_CHAT_AUTH_HEADER: ${N8N_CHAT_AUTH_HEADER:-}
      N8N_CHAT_AUTH_VALUE: ${N8N_CHAT_AUTH_VALUE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-4-5}
    networks:
      - shared-network
    labels:
      - "com.example.app=escalat"

networks:
  shared-network:
    external: true
    name: escalat-caddy_shared-network
